name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of letting them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let Spring engage in CI: it exists purely to speed up local
  # iterative dev/test cycles and only adds startup overhead and an extra
  # class of failure in a one-shot runner.
  DISABLE_SPRING: "1"
  RAILS_ENV: test
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rales_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Reads .ruby-version and Gemfile.lock's BUNDLED WITH automatically.
          bundler-cache: true

      - name: Load test schema
        run: bin/rails db:schema:load

      - name: Run test suite
        run: bundle exec rspec

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check for known-vulnerable gems
        run: |
          gem install bundler-audit --no-document
          bundle-audit check --update
